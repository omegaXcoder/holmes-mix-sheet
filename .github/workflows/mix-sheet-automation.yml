name: Mix Sheet Automation

on:
  schedule:
    # Runs the evening BEFORE the day it records - 8pm Mountain Time pulls each tech's
    # SCHEDULED jobs for the next day, so the mix sheet is ready ahead of time. Skips the
    # evening whose target (tomorrow) would be a Sunday - i.e. skips Saturday evening,
    # since Saturday's "tomorrow" is Sunday and the sheet has no Sunday row.
    #
    # 02:00 UTC = 8pm MDT (Mountain Daylight Time, UTC-6). This is a fixed UTC time, not
    # DST-aware, so during Mountain Standard Time (winter, UTC-7) this actually runs at
    # 7pm local - accepted as fine, same tradeoff as before.
    #
    # IMPORTANT: 8pm local crosses midnight UTC, landing on the NEXT UTC calendar day, so
    # the day-of-week to skip is NOT simply "Saturday" in UTC terms either - it happens to
    # line up this time (business Saturday 8pm MDT = UTC Sunday 02:00), but don't assume
    # that pattern holds if this schedule changes again - recompute it explicitly, the way
    # this was verified: for each business day, add 6 hours to 20:00 that day and check
    # what UTC day-of-week results.
    # Day-of-week: 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat - this list (1,2,3,4,5,6) is
    # every day EXCEPT Sunday in UTC terms, which is every business evening EXCEPT Saturday.
    - cron: '0 2 * * 1,2,3,4,5,6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scrape and compute everything but skip writing to the sheet'
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Write service account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}' > service-account-key.json

      - name: Run automation
        env:
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./service-account-key.json
          MIX_SHEETS_FOLDER_ID: 1KsCqKKnZOTAJbkXRf80ZT1JLF3ul-pzN
          MIX_SHEET_TEMPLATE_ID: 1g8E39SjoRwQUH-mmUUf0F7TMLUX7KC8cOVyxwKyX3bE
          # Optional (repository variable, not a secret - it's just an email address).
          # Only needed if the Mix Sheets folder is in a regular My Drive, in which case
          # creating a new month's sheet requires domain-wide delegation - see README
          # "Drive storage quota / monthly sheet creation". Empty = no impersonation.
          GOOGLE_IMPERSONATE_USER: ${{ vars.GOOGLE_IMPERSONATE_USER || '' }}
          BUSINESS_TIMEZONE: America/Denver
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          HEADLESS: 'true'
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: omega@kudos.marketing,madison@holmesutah.com
        run: npm start
